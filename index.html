<!DOCTYPE html>
<!--
  Proyecto: Bitácora de Trading - PSP
  Archivo: index.html
  Autores: Equipo de trabajo colaborativo PSP
  Fecha: 2026-11-08
  Descripción: Estructura del portal, formulario de operaciones, gráfico e historial.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Trading - PSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="contenedor-principal">
    <h1>Bitácora de Operaciones (Trading Journal)</h1>
    
    <!-- Resumen de Capital -->
    <div class="tarjeta-resumen">
      <h2>Balance Inicial: $10,000.00 USD</h2>
      <h3 id="balance-actual">Balance Actual: $10,000.00 USD</h3>
    </div>

    <!-- Formulario de Registro de Operaciones -->
    <div class="tarjeta-formulario">
      <h2>Registrar Nueva Operación</h2>
      <form id="formulario-operacion">
        <div class="grupo-campo">
          <label for="activo">Activo:</label>
          <input type="text" id="activo" required placeholder="Ej: EUR/USD, NAS100">
        </div>
        <div class="grupo-campo">
          <label for="tipo-operacion">Tipo de Operación:</label>
          <select id="tipo-operacion" required>
            <option value="compra">Compra</option>
            <option value="venta">Venta</option>
          </select>
        </div>
        <div class="grupo-campo">
          <label for="hora-entrada">Hora Entrada:</label>
          <input type="time" id="hora-entrada" required>
        </div>
        <div class="grupo-campo">
          <label for="lote">Tamaño de Lote:</label>
          <input type="number" step="0.01" id="lote" required placeholder="Ej: 0.10">
        </div>
        <div class="grupo-campo">
          <label for="tamano-contrato">Tamaño de Contrato:</label>
          <input type="number" step="0.01" min="0.01" id="tamano-contrato" required value="100000">
        </div>
        <div class="grupo-campo">
          <label for="precio-entrada">Precio Entrada:</label>
          <input type="number" step="0.00001" id="precio-entrada" required placeholder="Ej: 1.0850">
        </div>
        <div class="grupo-campo">
          <label for="tp">Take Profit (TP):</label>
          <input type="number" step="0.00001" id="tp" placeholder="Ej: 1.0900">
        </div>
        <div class="grupo-campo">
          <label for="sl">Stop Loss (SL):</label>
          <input type="number" step="0.00001" id="sl" placeholder="Ej: 1.0820">
        </div>
        <div class="grupo-campo">
          <label for="precio-salida">Precio Salida:</label>
          <input type="number" step="0.00001" id="precio-salida" required placeholder="Ej: 1.0890">
        </div>
        <div class="grupo-campo">
          <label for="hora-salida">Hora Salida:</label>
          <input type="time" id="hora-salida" required>
        </div>
        <div class="grupo-campo">
          <label for="pnl">P&L ($ USD):</label>
          <input type="number" step="0.01" id="pnl" required placeholder="Se calcula automáticamente">
        </div>
        <button type="submit" id="boton-guardar">Guardar Operación</button>
      </form>
    </div>

    <!-- Gráfico de Equidad -->
    <div class="tarjeta-grafico">
      <h2>Curva de Equidad (Equity Curve)</h2>
      <canvas id="lienzo-grafico" width="600" height="200"></canvas>
    </div>

    <!-- Tabla Histórica de Operaciones -->
    <div class="tarjeta-tabla">
      <h2>Historial de Operaciones</h2>
      <div class="contenedor-tabla">
      <table id="tabla-operaciones">
        <thead>
          <tr>
            <th>Activo</th>
            <th>H. Entrada</th>
            <th>Lote</th>
            <th>P. Entrada</th>
            <th>TP</th>
            <th>SL</th>
            <th>P. Salida</th>
            <th>H. Salida</th>
            <th>P&L ($)</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <!-- Las filas se cargan dinámicamente con JavaScript -->
        </tbody>
      </table>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
